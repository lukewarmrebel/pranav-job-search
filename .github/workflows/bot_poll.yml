name: Telegram Bot Poll

on:
  schedule:
    # every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -U openpyxl

      - name: Poll Telegram and process updates
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot_poll.py

      - name: Commit state changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          mkdir -p data
          git add data/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "bot: state update $(date -u +%Y-%m-%dT%H:%M)" &&
            git pull origin main --rebase 2>/dev/null || git pull origin master --rebase &&
            git push
          )
