name: Daily Job Scrape

on:
  schedule:
    # 5:00 AM IST = 11:30 PM UTC (prev day)
    - cron: '30 23 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -U python-jobspy pandas

      - name: Run JobSpy scraper
        run: python jobspy_run.py

      - name: Commit scraped jobs
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add jobs_raw.json
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "scrape: jobs_raw.json $(date -u +%Y-%m-%d)" &&
            git pull origin master --rebase &&
            git push
          )
