name: Daily Job Search

on:
  schedule:
    # 5:00 AM IST = 11:30 PM UTC (prev day)
    - cron: '30 23 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit jobs_raw.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -U python-jobspy pandas

      - name: Run JobSpy scraper
        run: python jobspy_run.py

      - name: Send job digest to Telegram
        continue-on-error: true
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOBS_JSON:        jobs_raw.json
        run: python3 telegram_notify.py

      - name: Commit & push results
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add jobs_raw.json
          git diff --staged --quiet && echo "No changes, skipping commit" || \
            git commit -m "chore: job search results $(date -u +%Y-%m-%d)" && git push
